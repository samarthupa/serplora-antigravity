<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Dark rounded square background (180x180 centered within the 192x192 canvas) -->
  <rect x="6" y="6" width="180" height="180" rx="42" fill="#1C1C1E" />
  
  <!-- White 'S' shifted slightly left (x=80 instead of 82) to balance the dot on the right -->
  <!-- Adjusted vertical alignment (y=144) for perfect top/bottom balance -->
  <text x="80" y="144" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="140" font-weight="900" fill="#FFFFFF" text-anchor="middle">S</text>
  
  <!-- Bright green dot, positioned to sit perfectly next to the 'S' -->
  <circle cx="144" cy="138" r="16" fill="#2ECC71" />
</svg>
